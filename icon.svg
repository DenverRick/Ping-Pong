<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="90%">
      <stop offset="0" stop-color="#2b4fb8"/>
      <stop offset="1" stop-color="#16265e"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b076"/>
      <stop offset="0.5" stop-color="#c98a4b"/>
      <stop offset="1" stop-color="#a86a33"/>
    </linearGradient>
    <radialGradient id="rubber" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f1f1f4"/>
      <stop offset="1" stop-color="#c9ccd6"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- paddle: round rubber face, short wooden handle, tilted like it is mid-swing -->
  <g transform="rotate(-32 256 290)">
    <rect x="221" y="330" width="70" height="165" rx="26" fill="url(#wood)" stroke="#6b4423" stroke-width="6"/>
    <rect x="221" y="330" width="70" height="42" rx="12" fill="#6b4423" opacity="0.55"/>
    <ellipse cx="256" cy="215" rx="152" ry="160" fill="#7f1d1d"/>
    <ellipse cx="256" cy="215" rx="140" ry="148" fill="url(#rubber)"/>
    <ellipse cx="205" cy="150" rx="46" ry="30" fill="#ffffff" opacity="0.18" transform="rotate(-25 205 150)"/>
  </g>
  <!-- ball -->
  <circle cx="118" cy="118" r="56" fill="url(#ball)" stroke="#b8bcc8" stroke-width="4"/>
</svg>
