<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Tracker</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --north-color: #3b82f6;
            --south-color: #ef4444;
            --text-dark: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen { display: none; width: 100%; max-width: 400px; }
        .active { display: block; }
        
        h1, h2 { text-align: center; }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        button.primary {
            width: 100%;
            padding: 16px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        button.danger {
            width: 100%;
            padding: 16px;
            background-color: #f3f4f6;
            color: #ef4444;
            border: 2px solid #ef4444;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .team-card {
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            margin: 15px 0;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .team-card p { margin: 10px 0 0 0; font-size: 16px; font-weight: normal; }
        .north { background-color: var(--north-color); }
        .south { background-color: var(--south-color); }
        .vs { text-align: center; font-size: 20px; font-weight: bold; color: #6b7280; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #e5e7eb; }
    </style>
</head>
<body>

    <div id="setup-screen" class="screen">
        <h1>Ping Pong Tracker</h1>
        <p>Enter 4 player names:</p>
        <input type="text" id="p1" placeholder="Player 1" value="Alice">
        <input type="text" id="p2" placeholder="Player 2" value="Bob">
        <input type="text" id="p3" placeholder="Player 3" value="Charlie">
        <input type="text" id="p4" placeholder="Player 4" value="Diana">
        <button class="primary" onclick="startGame()">Start Tournament</button>
    </div>

    <div id="game-screen" class="screen">
        <h2 id="round-title">Game 1</h2>
        <p style="text-align: center; color: #6b7280;">Tap the winning team</p>
        
        <div class="team-card north" onclick="recordWin('North')">
            NORTH
            <p id="north-players">P1 & P2</p>
        </div>
        
        <div class="vs">VS</div>
        
        <div class="team-card south" onclick="recordWin('South')">
            SOUTH
            <p id="south-players">P3 & P4</p>
        </div>
        
        <button class="danger" onclick="resetTournament()" style="margin-top: 40px;">End Tournament</button>
    </div>

    <div id="ranking-screen" class="screen">
        <h2>Rankings</h2>
        <table id="leaderboard">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Wins</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                </tbody>
        </table>
        <button class="primary" onclick="nextGame()">Next Game</button>
        <button class="danger" onclick="resetTournament()">End Tournament</button>
    </div>

    <script>
        // State Management
        let players = [];
        let gameIndex = 0;
        const combinations = [
            [0, 1, 2, 3], // P1+P2 vs P3+P4
            [0, 2, 1, 3], // P1+P3 vs P2+P4
            [0, 3, 1, 2]  // P1+P4 vs P2+P3
        ];
        let currentMatch = [];

        // Check for saved game on load
        window.onload = () => {
            const savedState = localStorage.getItem('pingPongState');
            if (savedState) {
                const state = JSON.parse(savedState);
                players = state.players;
                gameIndex = state.gameIndex;
                setupMatch();
                showScreen('game-screen');
            } else {
                showScreen('setup-screen');
            }
        };

        function saveState() {
            const state = { players, gameIndex };
            localStorage.setItem('pingPongState', JSON.stringify(state));
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            players = [
                { name: document.getElementById('p1').value || "Player 1", wins: 0 },
                { name: document.getElementById('p2').value || "Player 2", wins: 0 },
                { name: document.getElementById('p3').value || "Player 3", wins: 0 },
                { name: document.getElementById('p4').value || "Player 4", wins: 0 }
            ];
            gameIndex = 0;
            saveState(); // Save immediately after starting
            setupMatch();
            showScreen('game-screen');
        }

        function setupMatch() {
            const comboIndex = gameIndex % 3; 
            currentMatch = combinations[comboIndex];
            
            document.getElementById('round-title').innerText = `Game ${gameIndex + 1}`;
            document.getElementById('north-players').innerText = `${players[currentMatch[0]].name} & ${players[currentMatch[1]].name}`;
            document.getElementById('south-players').innerText = `${players[currentMatch[2]].name} & ${players[currentMatch[3]].name}`;
        }

        function recordWin(winningSide) {
            if (winningSide === 'North') {
                players[currentMatch[0]].wins += 1;
                players[currentMatch[1]].wins += 1;
            } else {
                players[currentMatch[2]].wins += 1;
                players[currentMatch[3]].wins += 1;
            }
            saveState(); // Save scores
            updateRankings();
            showScreen('ranking-screen');
        }

        function updateRankings() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            const sortedPlayers = [...players].sort((a, b) => b.wins - a.wins);
            
            sortedPlayers.forEach(p => {
                const row = `<tr><td>${p.name}</td><td>${p.wins}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        function nextGame() {
            gameIndex++;
            saveState(); // Save progress to next round
            setupMatch();
            showScreen('game-screen');
        }

        function resetTournament() {
            if (confirm("Are you sure you want to end this tournament? All scores will be lost.")) {
                localStorage.removeItem('pingPongState');
                players = [];
                gameIndex = 0;
                showScreen('setup-screen');
            }
        }
    </script>
</body>
</html>
